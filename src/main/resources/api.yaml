openapi: "3.0.3"

info:
  title: API de Tickets - HelpDesk
  version: 1.0.0
  description: Contrato de la API de tickets de soporte. Es la fuente de verdad del microservicio.

servers:
  - url: http://localhost:8080
    description: Entorno local

tags:
  - name: tickets
    description: Operaciones sobre los tickets de soporte

paths:
  /api/tickets:

    # ===== RESUELTO: usa esta operacion como ejemplo para las demas =====
    get:
      summary: Lista los tickets, con filtro opcional por estado
      operationId: listarTickets
      tags: [tickets]
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum: [ABIERTO, EN_PROGRESO, CERRADO]
      responses:
        '200':
          description: Lista de tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"


    # TODO 2: agrega la operacion post con operationId crearTicket y tags [tickets]  (RN-03)
    # TODO 3: la operacion post debe tener requestBody required: true con el schema
    #         TicketRequest en application/json

    # TODO 4: declara las respuestas '201' (con el schema Ticket) y '400' (Datos invalidos)
    post:
      summary: Crea un nuevo ticket
      operationId: crearTicket
      tags: [tickets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketRequest"
      responses:
        '201':
          description: Ticket creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        '400':
          description: Datos invalidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # TODO 5: agrega la ruta /api/tickets/{id} con la operacion get,
  #         operationId obtenerTicket y tags [tickets]
  # TODO 6: declara el parametro "id" (in: path, required: true) con
  #         schema type integer y format int64
  # TODO 7: declara las respuestas '200' (con el schema Ticket) y '404' (El ticket no existe)
  /api/tickets/{id}:
    get:
      summary: Obtiene un ticket por su ID
      operationId: obtenerTicket
      tags: [tickets]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Ticket encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        '404':
          description: El ticket no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    Ticket:
      type: object
      # TODO 8: marca como required los campos id, titulo, prioridad y estado
      properties:
        id:
          type: integer
          format: int64
          example: 1
        titulo:
          type: string
          example: No carga el reporte mensual
        prioridad:
          type: string
          enum: [ALTA, MEDIA, BAJA]
          example: ALTA
        # TODO 9: prioridad y estado son de tipo string con enum:
        #         prioridad -> [ALTA, MEDIA, BAJA]   estado -> [ABIERTO, EN_PROGRESO, CERRADO]
        estado:
          type: string
          enum: [ ABIERTO, EN_PROGRESO, CERRADO ]
          example: ABIERTO
        horasEstimadas:
          type: integer
          example: 4

    # TODO 10: crea el schema TicketRequest con titulo (string, minLength 5, maxLength 100)
    #          y prioridad (string, enum [ALTA, MEDIA, BAJA]); ambos required.   (RN-01 y RN-02)
    TicketRequest:
      type: object
      required:
        - titulo
        - prioridad
      properties:
        titulo:
          type: string
          minLength: 5
          maxLength: 100
          example: No carga el reporte mensual
        prioridad:
          type: string
          enum: [ALTA, MEDIA, BAJA]
          example: ALTA
    Error:
      type: object
      properties:
        mensaje:
          type: string